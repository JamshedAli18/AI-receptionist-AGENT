[project]
name = "voice-receptionist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cohere>=7.0.8",
    "dateparser>=1.4.2",
    "deepgram-sdk>=7.7.0",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.3",
    "groq>=0.31.1",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "mcp>=1.29.0",
    "ngrok>=1.7.0",
    "pinecone>=9.1.0",
    "pyjwt>=2.13.0",
    "pymongo>=4.16.0",
    "pyngrok>=8.1.2",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "resend>=2.36.0",
    "tiktoken>=0.13.0",
    "tzdata>=2026.3",
    "uvicorn>=0.52.2",
    "websockets>=15.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

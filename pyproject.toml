[project]
name = "voice-receptionist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cohere>=7.0.8",
    "dateparser>=1.4.2",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.3",
    "groq>=0.31.1",
    "instructor>=1.15.4",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "pinecone>=9.1.0",
    "pymongo>=4.16.0",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "resend>=2.36.0",
    "tiktoken>=0.13.0",
    "tzdata>=2026.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
